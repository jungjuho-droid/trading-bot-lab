baseURL: "https://jungjuho-droid.github.io/trading-bot-lab/"
defaultContentLanguage: "ko"
title: "Trading Bot Lab"
theme: "PaperMod"
paginate: 8

languages:
  ko:
    label: "한국어"
    locale: "ko-KR"
    weight: 1
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: ""

minify:
  disableXML: true

params:
  env: production
  mainSections: ["study", "posts"]
  title: "Trading Bot Lab"
  description: "혼자 돌리는 Trading Bot을 몇백 번 고쳐가며 배운 것들을 기록합니다."
  keywords: [Trading, Bot, Algorithm, "Lab Notes", 트레이딩, 알고리즘]
  author: "JH"
  DateFormat: "2006.01.02"
  defaultTheme: auto
  disableThemeToggle: false
  ShowShareButtons: true
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: true
    favicon: "/favicon.ico"

  label:
    text: "Trading Bot Lab"
    icon: ""
    iconHeight: 35

  homeInfoParams:
    Title: "Trading Bot Lab"
    Content: >
      이 랩의 메인은 **[지표 스터디](/trading-bot-lab/study/)** 입니다 — 매매 지표를 공식에서 코드로,
      코드에서 실계좌의 게이트 값까지 해부합니다.


      그 아래로는 자동매매 Bot 461개 버전의 개발 기록이 시대순으로 쌓여 있습니다.


      <span style="font-size:0.82em; opacity:0.6; letter-spacing:0.01em;">INDICATOR STUDY is the main course here — formulas, then code, then a live account. The 461-version dev log is the archive beneath it.</span>

  socialIcons:
    - name: github
      url: "https://github.com/"
    - name: rss
      url: "index.xml"

  editPost:
    URL: ""
    Text: ""
    appendFilePath: false

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: home
      name: 홈
      url: /
      weight: 10
    - identifier: study
      name: 지표 스터디
      url: /study/
      weight: 12
    - identifier: posts
      name: 글 목록
      url: /posts/
      weight: 20
    - identifier: about
      name: 소개
      url: /about/
      weight: 30
    - identifier: search
      name: 검색
      url: /search/
      weight: 40
    - identifier: tags
      name: 태그
      url: /tags/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
  series: series

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

sitemap:
  changefreq: weekly
  priority: 0.5
