baseURL: "https://jungjuho-droid.github.io/trading-bot-lab/"
defaultContentLanguage: "ko"
title: "Trading Bot Lab"
theme: "PaperMod"
paginate: 8

languages:
  ko:
    label: "한국어"
    locale: "ko-KR"
    weight: 1
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: ""

minify:
  disableXML: true

params:
  env: production
  mainSections: ["study", "posts"]
  title: "Trading Bot Lab"
  description: "혼자 돌리는 Trading Bot을 몇백 번 고쳐가며 배운 것들을 기록합니다."
  keywords: [Trading, Bot, Algorithm, "Lab Notes", 트레이딩, 알고리즘]
  author: "JH"
  DateFormat: "2006.01.02"
  defaultTheme: auto
  disableThemeToggle: false
  ShowShareButtons: true
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: true
    favicon: "/favicon.ico"

  label:
    text: "Trading Bot Lab"
    icon: ""
    iconHeight: 35

  homeInfoParams:
    Title: "Trading Bot Lab"
    Content: >
      안녕하세요. 이 블로그는 혼자서 트레이딩 봇을 만들고, 부수고, 다시 고치는 과정을 기록하는 공간입니다.


      거창한 투자 리포트나 "이렇게 하면 무조건 번다" 류의 글은 아니고요, 그냥 새벽에 봇 로그 들여다보다가 깨달은 것들,
      코드 한 줄 고쳤다가 계좌가 웃거나 우는 이야기들을 가볍게 씁니다. 완성형보다는 진행형에 가까운 글이 많을 거예요.


      > "시장에서 살아남는 사람은 가장 똑똑한 사람이 아니라, 가장 오래 버틴 사람이다." — 제시 리버모어


      버티는 쪽에 걸어보려고 합니다. 천천히, 자주 쓸게요.

  socialIcons:
    - name: github
      url: "https://github.com/"
    - name: rss
      url: "index.xml"

  editPost:
    URL: ""
    Text: ""
    appendFilePath: false

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: home
      name: 홈
      url: /
      weight: 10
    - identifier: study
      name: 지표 스터디
      url: /study/
      weight: 12
    - identifier: posts
      name: 글 목록
      url: /posts/
      weight: 20
    - identifier: about
      name: 소개
      url: /about/
      weight: 30
    - identifier: search
      name: 검색
      url: /search/
      weight: 40
    - identifier: tags
      name: 태그
      url: /tags/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
  series: series

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

sitemap:
  changefreq: weekly
  priority: 0.5
