baseURL: "https://jungjuho-droid.github.io/trading-bot-lab/"
defaultContentLanguage: "ko"
title: "Trading Bot Lab"
theme: "PaperMod"
paginate: 8

languages:
  ko:
    label: "한국어"
    locale: "ko-KR"
    weight: 1
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# 초기 연재분(자동 생성 451편)은 시대별 아카이브로 통합했다.
# 원본 파일은 저장소에 남기되 사이트에는 게시하지 않는다.
ignoreFiles:
  - "content/posts/vv[0-9]+\\.md$"
  - "content/posts/(ma|upbit|hy|base|macro|bithumb|engine|vvwap)-.*\\.md$"
  - "content/posts/bt-.*\\.md$"

googleAnalytics: ""

minify:
  disableXML: true

params:
  env: production
  mainSections: ["study", "posts", "archive"]
  title: "Trading Bot Lab"
  description: "혼자 트레이딩 봇을 만들고 부수고 고치는 기록. 매매 지표를 공식부터 코드까지 뜯어봅니다."
  keywords: [트레이딩봇, 자동매매, 매매지표, RSI, 거래량, 업비트, 개발일지]
  author: "JH"
  DateFormat: "2006년 1월 2일"
  defaultTheme: auto
  disableThemeToggle: false
  ShowShareButtons: false
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: true
    favicon: "/favicon.ico"

  label:
    text: "Trading Bot Lab"
    icon: ""
    iconHeight: 35

  homeInfoParams:
    Title: "Trading Bot Lab"
    Content: >
      안녕하세요. 이 블로그는 혼자서 트레이딩 봇을 만들고, 부수고, 다시 고치는 과정을 기록하는 공간입니다.


      거창한 투자 리포트나 "이렇게 하면 무조건 번다" 류의 글은 아니고요, 그냥 새벽에 봇 로그 들여다보다가 깨달은 것들,
      코드 한 줄 고쳤다가 계좌가 웃거나 우는 이야기들을 가볍게 씁니다. 완성형보다는 진행형에 가까운 글이 많을 거예요.


      > "시장에서 살아남는 사람은 가장 똑똑한 사람이 아니라, 가장 오래 버틴 사람이다." — 제시 리버모어


      버티는 쪽에 걸어보려고 합니다. 천천히, 자주 쓸게요.

  footer:
    hideCopyright: false
    text: >
      문의 jungjuho@gmail.com · [개인정보 처리방침](/trading-bot-lab/privacy/)


      이곳의 글은 개인의 개발 기록이며 투자 권유가 아닙니다.

  editPost:
    URL: ""
    Text: ""
    appendFilePath: false

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: home
      name: 홈
      url: /
      weight: 10
    - identifier: study
      name: 지표 스터디
      url: /study/
      weight: 20
    - identifier: posts
      name: 개발일지
      url: /posts/
      weight: 30
    - identifier: archive
      name: 개발 아카이브
      url: /archive/
      weight: 40
    - identifier: about
      name: 소개
      url: /about/
      weight: 50
    - identifier: search
      name: 검색
      url: /search/
      weight: 60

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
  series: series

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

sitemap:
  changefreq: weekly
  priority: 0.5
