baseURL: "https://jungjuho-droid.github.io/trading-bot-lab/"
defaultContentLanguage: "ko"
title: "Trading Bot Lab"
theme: "PaperMod"
paginate: 8

languages:
  ko:
    label: "한국어"
    locale: "ko-KR"
    weight: 1
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: ""

minify:
  disableXML: true

params:
  env: production
  mainSections: ["study", "posts"]
  title: "Trading Bot Lab"
  description: "혼자 돌리는 Trading Bot을 몇백 번 고쳐가며 배운 것들을 기록합니다."
  keywords: [Trading, Bot, Algorithm, "Lab Notes", 트레이딩, 알고리즘]
  author: "JH"
  DateFormat: "2006.01.02"
  defaultTheme: auto
  disableThemeToggle: false
  ShowShareButtons: true
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: true
    favicon: "/favicon.ico"

  label:
    text: "Trading Bot Lab"
    icon: ""
    iconHeight: 35

  homeInfoParams:
    Title: "Trading Bot Lab"
    Content: >
      공식에서 코드로, 코드에서 실계좌 잔고까지. [지표](/trading-bot-lab/study/) 하나를 이 순서로 끝까지 팹니다.


      교과서는 RSI 30에서 사라던데, 제 봇은 45에서 삽니다. 그 숫자가 어디서 왔는지를 씁니다.


      백 일 남짓 동안 461번 고쳤어요. 하루 네 번꼴. 잘된 것만 남기면 기록이 아니라 광고라서, 말아먹은 버전도 안 지웠습니다.


      <span style="font-size:0.82em; opacity:0.6; letter-spacing:0.01em;">Formulas → code → a live account. 461 versions, failures included.</span>

  socialIcons:
    - name: github
      url: "https://github.com/"
    - name: rss
      url: "index.xml"

  editPost:
    URL: ""
    Text: ""
    appendFilePath: false

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: home
      name: 홈
      url: /
      weight: 10
    - identifier: study
      name: 지표 스터디
      url: /study/
      weight: 12
    - identifier: posts
      name: 글 목록
      url: /posts/
      weight: 20
    - identifier: about
      name: 소개
      url: /about/
      weight: 30
    - identifier: search
      name: 검색
      url: /search/
      weight: 40
    - identifier: tags
      name: 태그
      url: /tags/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
  series: series

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

sitemap:
  changefreq: weekly
  priority: 0.5
